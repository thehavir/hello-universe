name: hello_universe
description: Connect to Nasa API and fetch and show Nasa Astronomy Picture Of Day (APOD).

publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ^3.38.7

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  go_router: ^17.0.1
  chopper: ^8.5.0
  chopper_built_value: ^3.3.0
  built_value: ^8.12.0
  built_collection: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  test: ^1.26.3
  bloc_test: ^10.0.0
  mockito: ^5.6.3
  build_runner: ^2.10.5
  analyzer: ^8.4.1
  built_value_generator: ^8.12.0
  chopper_generator: ^8.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/error.png
    - assets/no-results.png
    - assets/no-image.png
    - assets/placeholder.png
    - assets/splash.png
