name: hello_universe
description: Connect to Nasa API and fetch and show Nasa Astrohomy Picture Of Day (APOD).

publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ^3.38.7

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  http: ^1.5.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/error.png
    - assets/no-results.png
    - assets/no-image.png
    - assets/placeholder.png
    - assets/splash.png
